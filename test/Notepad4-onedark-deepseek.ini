[Styles]
; ==========================================
; One Dark Pro 风格配色方案 for Notepad4
; 基于 VSCode / Neovim 流行暗色主题调优
; ==========================================

; 全局默认代码样式（基础字体与背景）
Default Code Style=font:Consolas,size:11,fore:#ABB2BF,back:#282C34

; --- 通用语法元素 ---

; 注释（灰蓝色，降低视觉干扰）
Comment=fore:#5C6370,italic

; 关键字（哑光紫/红，如 function, return, if）
Keyword=fore:#C678DD

; 内置类型与常量（浅蓝色）
Type=fore:#56B6C2
BuiltinType=fore:#56B6C2

; 字符串（柔和的绿色，避免荧光感）
String=fore:#98C379

; 数字常量（淡橙色）
Number=fore:#D19A66

; 运算符与标点（中性灰色）
Operator=fore:#ABB2BF
Punctuation=fore:#ABB2BF

; 函数名（淡黄色）
Function=fore:#61AFEF

; 变量名（浅蓝灰）
Variable=fore:#E06C75

; 类名 / 类型名（青绿色）
Class=fore:#E5C07B

; --- 编辑器 UI 元素 ---

; 行号边距（弱化显示）
Line Number=fore:#4B5263,back:#282C34

; 匹配的括号（高亮）
Matching Brace=fore:#528BFF,back:#3E4451

; 当前行高亮（微弱背景）
Current Line=back:#2C313C

; 选中文本背景
Selected Text=back:#3E4451

; 缩进引导线（非常淡的灰）
Indentation Guide=fore:#3B4048