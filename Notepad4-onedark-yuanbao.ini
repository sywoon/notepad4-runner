; =========================================================
; Notepad4 暗色编程配色 - One Dark Pro 基调
; 适用：Schemes -> Customize Schemes -> Import
; 或合并进 Notepad4.ini；再开 Schemes -> Style Theme -> Dark
; 字体可改成 Consolas / JetBrains Mono / Fira Code / Cascadia Code
; =========================================================

[Common Base]
; 全局默认：文本/背景/等宽字体
Default Style=font:Cascadia Code; size:11; fore:#ABB2BF; back:#282C34
; 行号与边距
Margins and Line Numbers=font:Cascadia Code; size:-2; fore:#5C6370; back:#21252B
; 括号匹配
Matching Braces=fore:#282C34; back:#56B6C2; bold
Matching Braces (Indicator)=fore:#56B6C2; alpha:40; indic_roundbox
; 选择块
Selection=fore:#282C34; back:#3E4451; alpha:60
; 当前行高亮（低存在感）
Current Line=back:#2C313A; alpha:60
; 光标
Caret=fore:#528BFF; block
; 缩进参考线/空白符
Indent Guides=fore:#3E4451
Whitespace=fore:#3E4451

[Text Files]
Default Style=font:Cascadia Code; size:11; fore:#ABB2BF; back:#282C34
FileNameExtensions=txt;text;log;asc;doc;diz;nfo;md

[C/C++ Source Code]
Default=fore:#ABB2BF
Comment=italic; fore:#5C6370
Keyword=bold; fore:#C678DD
Type Keyword=fore:#E5C07B
String=fore:#98C379
Character=fore:#98C379
Number=fore:#D19A66
Operator=fore:#56B6C2
Preprocessor=fore:#C586C0
Function=fore:#61AFEF
FileNameExtensions=c;cc;cpp;cxx;h;hh;hpp;hxx;inl;ixx;tpp

[Python Script]
Default=fore:#ABB2BF
Comment=italic; fore:#5C6370
Keyword=bold; fore:#C678DD
Builtin=fore:#E5C07B
String=fore:#98C379
Number=fore:#D19A66
Function=fore:#61AFEF
Decorator=fore:#C586C0
Operator=fore:#56B6C2
FileNameExtensions=py;pyw;pyx

